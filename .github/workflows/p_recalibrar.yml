name: 'Prueba: Recalibrar la cadena completa (semanal)'
'on':
  push:
    branches:
    - servidor-prueba
    paths:
    - .github/workflows/p_recalibrar.yml
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: prueba-recalibrar
  cancel-in-progress: false
jobs:
  recalibrar:
    runs-on:
    - self-hosted
    - sharpicks-vps
    timeout-minutes: 180
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4
    - name: 'Prueba: nunca empujar a main'
      run: 'printf ''#!/bin/sh\nwhile read a b c d; do case "$c" in refs/heads/main) echo BLOQUEADO; exit 1;; esac; done\n'' > .git/hooks/pre-push

        chmod +x .git/hooks/pre-push

        git config remote.origin.push +HEAD:refs/heads/prueba-salida-recalibrar'
    - name: Abrir los datos cifrados
      env:
        DATOS_CLAVE: ${{ secrets.DATOS_CLAVE }}
      run: python3 cajon.py abrir
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Instalar dependencias
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt


        python -c "import requests, pandas, numpy; requests.get" || pip install --force-reinstall --no-cache-dir -r requirements.txt   # v516: una instalación cortada a medias se repara sola

        '
    - name: Bajar la foto de precios
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'echo "FOTO_PRECIOS_TTL=14400" >> "$GITHUB_ENV"

        python foto_precios.py --bajar || echo "::warning::sin foto nueva de precios; sigue la anterior si no caducó"

        '
    - name: Refrescar el histórico de ITF y challenger
      run: python ingesta_itf.py --desde 2015 || echo "::warning::ingesta ITF con avisos"
    - name: Fondo histórico de estadísticas de ESPN
      continue-on-error: true
      timeout-minutes: 100
      run: 'python stats_espn.py --desde 2021-01-01 || echo "::warning::fondo histórico con avisos"

        python stats_espn.py --limpiar || echo "::warning::limpieza con avisos"

        python stats_estimadas.py --ajustar || echo "::warning::ajuste con avisos"

        python informe_calibracion.py --md INFORME_CALIBRACION.md || echo "::warning::informe con avisos"

        '
    - name: Reconstruir la base de cuotas de cierre
      run: "python import_historical_odds.py \\\n  || echo \"::warning::importacion de cuotas de cierre con avisos\"\n"
    - name: Recalibrar la cadena completa
      run: python recalibrar_todo.py || echo "::warning::recalibración con avisos"
    - name: Ranking de estabilidad por mercado
      run: python mercado_estabilidad.py || echo "::warning::ranking de estabilidad con avisos"
    - name: Índice de riesgo por competición
      run: python riesgo_liga.py || echo "::warning::índice de riesgo con avisos"
    - name: Verificar los ids de FotMob de las ligas
      continue-on-error: true
      timeout-minutes: 20
      run: python fotmob_ligas.py --forzar || echo "::warning::ids de FotMob con avisos"
    - name: Patrones por liga
      run: python patrones_liga.py --entrenar || echo "::warning::patrones por liga con avisos"
    - name: Validar el motor de goles
      run: python motor_goles.py mex_femenil champions_femenil fem_inglaterra fem_espana fem_alemania fem_francia fem_italia || echo "::warning::motor de goles con avisos"
    - name: Puerta de activación de las reglas v212
      run: python backtest_v212.py || echo "::warning::backtest v212 con avisos"
    - name: Publicar el estado de la recalibración
      run: "python - <<'PY'\nimport json, os, sys\nif not os.path.exists('recalibracion_estado.json'):\n    print('::warning::no se generó recalibracion_estado.json')\n    sys.exit(0)\nd = json.load(open('recalibracion_estado.json', encoding='utf-8'))\nprint(f\"{d['ok']}/{len(d['pasos'])} pasos OK en {d['segundos_total']:.0f}s\")\nfor p in d['pasos']:\n    print(f\"  {'OK ' if p['ok'] else 'FALLO'} {p['paso']}: \"\n          f\"{p.get('detalle') or p.get('error')}\")\nfor f in d.get('fallos') or []:\n    print(f'::warning::paso fallido: {f}')\nPY\n"
    - name: Vigilar la frescura de los datos que aprenden
      run: "python frescura_datos.py \\\n  || echo \"::warning::hay datos parados, mira frescura_datos.json\"\n"
    - name: Commitear las calibraciones actualizadas
      run: "git config user.name  \"recalibrar-bot\"\ngit config user.email \"actions@github.com\"\n# v186 — SIN `modelos/`, Y SIN TRAGARSE EL FALLO.\n#\n# Este `git add` llevaba `modelos/tennis` y `modelos/tennis_wta`,\n# y desde la v161 (2026-08-22) `modelos/` está en .gitignore: sus\n# pesos viajan por el GitHub Release, no por el repositorio.\n# `git add` con un path ignorado **falla entero y no añade\n# NINGUNO de los demás** —comprobado, devuelve exit 1— y el\n# `|| true` se lo tragaba.\n#\n# Efecto medido: la recalibración corría cada lunes y sólo\n# commiteaba `_v162_calibracion_por_liga.json`, que va en su\n# propio `git add`. `pick_ledger_total.csv` llevaba desde el\n# 2026-07-29 sin actualizarse y `umbrales_capa1.json` desde el\n# 2026-07-28: seis semanas sin medir si los pronósticos\n# aciertan, con el workflow en verde.\ngit add -A historico_itf.csv.gz \\\n           pick_ledger_total.csv calibracion_confianza.json \\\n           precision_ligas.json edge_map.json deportes_capa1.json \\\n           calibracion_mercado.json umbrales_capa1.json \\\n           recalibracion_estado.json frescura_datos.json \\\n           _v75_pick_ledger.json _v78_ledger_deportes.json \\\n  || echo \"::warning::git add de las calibraciones falló\"\n# v162 — el fondo histórico de estadísticas de ESPN y lo que\n# se deriva de él. Sin commitearlo, el trabajo de 3-4 h del paso\n# de arriba se pierde con el runner.\n# v186 — aquí había un «\\n» LITERAL en medio del comando, en\n# vez de un salto de línea: el shell lo pasaba como argumento y\n# el `git add` se rompía. Otro fallo callado por el `|| true`.\ngit add -A stats_espn/ stats_fotmob/ stats_flashscore/ calibracion_stats_liga.json \\\n           INFORME_CALIBRACION.md \\\n  || echo \"::warning::git add del fondo de estadísticas falló\"\n# v169 — y el ranking de estabilidad, que sale del informe de arriba.\n# v189 — sin `2>/dev/null || true`. Ese era EXACTAMENTE el patron\n# que escondio el bug de la v186 durante seis semanas: un `git add`\n# que falla, se calla, y el workflow termina en verde sin haber\n# anadido nada. Si falla, que se vea.\ngit add -A mercado_estable_por_liga.json || echo \"::warning::git add del ranking de estabilidad fallo\"\n# v256 - LO QUE ANTES SE REHACIA A MANO Y POR ESO ENVEJECIA SOLO.\n#\n# `pick_ledger_totales.csv` alimenta la calibracion por banda de\n# cuota, que corrige TODAS las probabilidades publicadas. Se\n# encontro con 42 dias mientras este workflow corria en verde cada\n# lunes, porque no estaba en la cadena. Y `calibracion_bandas.json`\n# se entrenaba ejecutando su script a mano.\n#\n# Bucle por fichero, como en `precalculo_dia`: un `git add` con un\n# pathspec que no existe falla ENTERO y se lleva los demas.\n# v263 — `pick_ledger.csv` y `pick_ledger_total.csv` FALTABAN.\n#\n# El paso 1 los reconstruye cada lunes —76 minutos medidos el\n# 2026-09-14: futbol 80.908 filas (+32.960), deportes 328.865\n# (+256.733)— y al no estar en esta lista el runner se destruia\n# con el trabajo dentro. Produccion se quedo con la version del\n# 2026-07-28: OCHO SEMANAS, mientras el workflow salia en verde\n# cada lunes y su propio informe decia «ok: true».\n#\n# `pick_ledger.csv` no es uno cualquiera: es el 1X2 de futbol,\n# el unico que guarda el precio de Pinnacle (26.666 filas) y por\n# tanto el unico con el que se puede validar `valor_vs_sharp`,\n# que es el canal que de verdad gana. Tambien es el que impide\n# medir el movimiento de linea: el historico de precios empieza\n# el 2026-07-30 y el de resultados acaba el 2026-07-28, con dos\n# dias de separacion y cero solape.\nfor _f in memoria_equipos.json selector_apuestas.txt selector_apuestas.json radar_errores.txt radar_errores.json radar_capturas.csv pick_ledger.csv pick_ledger_total.csv pick_ledger_totales.csv calibracion_bandas.json calibracion_goles.json pick_ledger_handicap.csv pick_ledger_deportes.csv pronosticos_emitidos.json; do\n  if [ -e \"$_f\" ]; then\n    git add \"$_f\" || echo \"::warning::git add de $_f fallo\"\n  fi\ndone\ngit add -A _v162_calibracion_por_liga.json || echo \"::warning::git add de la calibracion por liga fallo\"\n# v202 — el indice de riesgo por competicion, que sale del ledger de\n# totales reconstruido arriba. Sin commitearlo, la app desplegada\n# ordena las patas con el indice del dia en que alguien lo genero a\n# mano, que es exactamente lo que le paso a umbrales_capa1.json.\ngit add -A indice_volatilidad_liga.json || echo \"::warning::git add del indice de riesgo fallo\"\ngit add -A patrones_liga.json || echo \"::warning::git add de los patrones por liga fallo\"\ngit add -A motor_goles.json || echo \"::warning::git add del motor de goles fallo\"\ngit add -A fotmob_ligas.json || echo \"::warning::git add de los ids de FotMob fallo\"\n# v212 — el veredicto de la puerta. Sin commitearlo, la app\n# desplegada leeria la activacion del dia en que alguien corrio el\n# backtest a mano, y una regla que dejo de cumplir los criterios\n# seguiria encendida en produccion. Es el mismo fallo que la v202\n# arreglo con el indice de riesgo.\ngit add -A activacion_v212.json backtesting_v212.md || echo \"::warning::git add de la activacion v212 fallo\"\n# v284 — EL PUSH SIN REBASE TIRABA HORA Y MEDIA DE TRABAJO.\n#\n# El 2026-09-21 este job corrio 1 h 36 min, commiteo 26 ficheros con\n# 923.854 lineas... y el push salio rechazado:\n#\n#     ! [rejected]  main -> main (fetch first)\n#     hint: the remote contains work that you do not have locally\n#\n# Entre que el runner hizo `checkout` y que llego aqui, el workflow\n# de las cuotas (cada 2 h) y un empujon manual habian movido `main`.\n# El commit se quedo DENTRO del runner, el runner se destruyo, y la\n# recalibracion semanal entera se perdio.\n#\n# Esto es el mismo tipo de fallo que este propio fichero documenta\n# tres veces mas arriba: un paso que falla al final y se lleva por\n# delante el trabajo de todo el job. La diferencia es que aqui ni\n# siquiera se callaba —el job salio en rojo— pero el resultado para\n# el proyecto es identico: cero.\n#\n# Y era el UNICO workflow del repositorio con `git push` a secas.\n# `cuotas_mx`, `precalculo_dia`, `precalcular_rosters`, `radar_diario`\n# y `retrain_leagues` ya rebasan antes. Este bucle es literalmente el\n# de `retrain_leagues`, que lleva funcionando desde la v186.\nif git diff --cached --quiet; then\n  echo \"Las calibraciones no cambiaron esta semana.\"\nelse\n  fecha=$(date -u +%Y-%m-%d)\n  git commit -m \"chore(calibracion): recalibración semanal de la cadena ($fecha)\"\n  # v312 — ver `git_sin_conflictos.py` (el `|| true` de antes podía\n  # dejar ficheros a medio fundir)\n  if ! python git_sin_conflictos.py publicar; then\n    echo \"::error::No se pudo publicar la recalibración.\"\n    exit 1\n  fi\n  echo \"Calibraciones actualizadas y publicadas.\"\nfi\n"
