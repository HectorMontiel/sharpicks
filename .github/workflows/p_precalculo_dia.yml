name: 'Prueba: Precálculo del día'
'on':
  push:
    branches:
    - servidor-prueba
    paths:
    - .github/workflows/p_precalculo_dia.yml
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: prueba-precalculo_dia
  cancel-in-progress: false
jobs:
  precalcular:
    runs-on:
    - self-hosted
    - sharpicks-vps
    timeout-minutes: 45
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4
    - name: 'Prueba: nunca empujar a main'
      run: 'printf ''#!/bin/sh\nwhile read a b c d; do case "$c" in refs/heads/main) echo BLOQUEADO; exit 1;; esac; done\n'' > .git/hooks/pre-push

        chmod +x .git/hooks/pre-push

        git config remote.origin.push +HEAD:refs/heads/prueba-salida-precalculo_dia'
    - name: Abrir los datos cifrados
      env:
        DATOS_CLAVE: ${{ secrets.DATOS_CLAVE }}
      run: python3 cajon.py abrir --estricto
    - name: ¿Hace falta cocinar el día?
      id: frescura
      run: "FRESCURA_MINUTOS=100\nif [ \"${{ github.event_name }}\" != \"schedule\" ]; then\n  echo \"Lanzado a mano: se cocina sin mirar la edad.\"\n  echo \"saltar=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nif [ ! -f pronostico_dia.json ]; then\n  echo \"No hay precalculo todavia: se cocina.\"\n  echo \"saltar=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nGEN=$(python3 -c \"import json;print(json.load(open('pronostico_dia.json',encoding='utf-8')).get('generado') or '')\" 2>/dev/null || echo '')\nSEG=$(date -u -d \"$GEN\" +%s 2>/dev/null || echo 0)\nif [ -z \"$GEN\" ] || [ \"$SEG\" = \"0\" ]; then\n  echo \"Sin fecha legible ($GEN): se cocina.\"\n  echo \"saltar=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nEDAD=$(( ( $(date -u +%s) - SEG ) / 60 ))\necho \"El dia se cocino hace $EDAD min (umbral $FRESCURA_MINUTOS) — $GEN\"\n# v327 — UN PRECÁLCULO DE AYER (UTC) NO ES FRESCO. Las decisiones\n# precalculadas sólo valen el mismo día (`decisiones_dia._dia`), así\n# que a medianoche UTC —las 18:00 en CDMX— dejaban de servir y esta\n# pasada se saltaba el cocinado por «fresco» hasta 100 min más.\nif [ \"$(date -u -d \"$GEN\" +%F)\" != \"$(date -u +%F)\" ]; then\n  echo \"Cocinado otro día (UTC): se cocina.\"\n  echo \"saltar=false\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nif [ \"$EDAD\" -lt \"$FRESCURA_MINUTOS\" ] && [ \"$EDAD\" -ge 0 ]; then\n  echo \"Fresco: esta pasada no hace nada.\"\n  echo \"saltar=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"Viejo: se cocina.\"\n  echo \"saltar=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Configurar Python
      if: steps.frescura.outputs.saltar != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Instalar dependencias
      if: steps.frescura.outputs.saltar != 'true'
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt


        python -c "import requests, pandas, numpy; requests.get" || pip install --force-reinstall --no-cache-dir -r requirements.txt   # v516: una instalación cortada a medias se repara sola

        '
    - name: Bajar la foto de precios
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'echo "FOTO_PRECIOS_TTL=14400" >> "$GITHUB_ENV"

        python foto_precios.py --bajar || echo "::warning::sin foto nueva de precios; sigue la anterior si no caducó"

        '
    - name: Refrescar selecciones y Femenil
      if: steps.frescura.outputs.saltar != 'true' && inputs.rapido != true
      continue-on-error: true
      timeout-minutes: 15
      run: 'python historico_selecciones.py || echo "::warning::historico de selecciones con avisos"

        # v323 — el motor de selecciones, al día: los resultados nuevos de

        # ESPN pasan a `historico_partidos.csv` y se regenera

        # `team_stats.json`. Estaba congelado el 2026-07-15; medido en 146

        # partidos fuera de muestra, log-loss 1,017 -> 0,988 (p5 +0,015).

        # Ver la cabecera de `actualizar_selecciones.py`.

        python actualizar_selecciones.py || echo "::warning::motor de selecciones sin actualizar"

        python historico_fotmob.py || echo "::warning::historico de FotMob con avisos"

        # v306 — las bajas (lesiones y sanciones) de los partidos próximos

        python bajas_fotmob.py || echo "::warning::bajas con avisos"

        # v325 — la NFL de nflverse: marcadores, EPA y el QUARTERBACK PREVISTO

        # de los partidos que faltan (lo que mueve una línea de la NFL). El

        # modelo `modelo_nfl` (v325) lee este fichero; sin red se queda con

        # el último commiteado.

        python nfl_nflverse.py || echo "::warning::histórico de nflverse sin actualizar"

        # v480 — los resultados de ITF (BetExplorer) en CADA pasada, no sólo en el reentrenamiento

        # diario: el 26 y el 27-oct el reentrenamiento se cortó a los 90 min, no publicó y ~430 picks

        # de tenis se quedaron sin cerrar (el feed del día de Flashscore se recorta en días pasados).

        python acumular_itf.py || echo "::warning::acumulación de ITF con avisos"

        '
    - name: Remates por jugador (FotMob)
      if: steps.frescura.outputs.saltar != 'true' && inputs.rapido != true
      continue-on-error: true
      timeout-minutes: 20
      run: 'python remates_fotmob.py --max 500 || echo "::warning::remates de FotMob con avisos"

        # la Liga MX Femenil: FotMob sólo da su marcador; los remates de

        # cada equipo salen de Flashscore

        python remates_flashscore.py || echo "::warning::remates de Flashscore con avisos"

        '
    - name: Cocinar el día
      if: steps.frescura.outputs.saltar != 'true'
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: "if python precalculo_dia.py; then\n  exit 0\nfi\necho \"::warning::primer intento sin resultado; se reintenta en 120 s\"\nsleep 120\nif python precalculo_dia.py; then\n  exit 0\nfi\necho \"::warning::el precalculo no se pudo generar. La app sigue sirviendo el anterior mientras tenga menos de 36 h.\"\n"
    - name: Líneas de remates por jugador
      if: steps.frescura.outputs.saltar != 'true' && inputs.rapido != true
      continue-on-error: true
      timeout-minutes: 15
      run: python lineas_jugador.py --dias 2 || echo "::warning::líneas de jugador con avisos"
    - name: Comprobar lo que se generó
      if: steps.frescura.outputs.saltar != 'true'
      run: python precalculo_dia.py --estado
    - name: Medir la señal de las bajas
      if: steps.frescura.outputs.saltar != 'true'
      run: python senal_bajas.py --medir || echo "::warning::señal de bajas sin medir"
    - name: Comprobar que Playdoit responde
      if: steps.frescura.outputs.saltar != 'true'
      run: 'python -c "import cuotas_multi as cm; n = len(cm._indice_pdt(''futbol'')); print(''Playdoit, partidos de fútbol con cuota:'', n); n or print(''::warning::Playdoit no devolvió ningún partido de fútbol: las tarjetas se quedan sin su precio'')" || echo "::warning::no se pudo comprobar Playdoit"

        '
    - name: Publicar el día cocinado
      if: steps.frescura.outputs.saltar != 'true'
      env:
        DATOS_CLAVE: ${{ secrets.DATOS_CLAVE }}
      run: "git config user.name  \"precalculo-bot\"\ngit config user.email \"actions@github.com\"\n# El archivo de contexto viaja con el precálculo: lo escribe la misma\n# pasada y es la materia prima para medir, más adelante, si las\n# banderas de la v209 (lesiones, racha, entrenador) anticipan algo.\n# Sin commitearlo se perdería con el runner.\n# `ponches_snapshots.csv` va con ellos desde la v227: es un fichero\n# que sólo CRECE y que no se puede reconstruir hacia atrás, porque\n# son los precios que había abiertos a esa hora. Si no se commitea,\n# se va con el runner y la muestra no se acumula nunca.\n# `jugados_dia.json` va desde la v229 por el mismo motivo que el\n# resto: son 186 peticiones a ESPN y 13 s medidos, y sin commitearlo\n# los pagaría el navegador del usuario en cada pasada.\n# v237 — SE ANADE LO QUE EXISTE, UNO A UNO. ESTO TENIA LA APP\n# CONGELADA.\n#\n# `git add a.json b.csv` falla ENTERO si UNO de los paths no existe\n# —«pathspec did not match any files»— y no anade ninguno de los\n# demas. Con el `|| echo warning` detras, el workflow termina en\n# verde sin haber commiteado nada.\n#\n# `ponches_snapshots.csv` solo se crea los dias que Pinnacle tiene\n# props de ponches abiertos. El dia que no los hay, el `add` fallaba\n# y el PRECALCULO ENTERO se quedaba sin publicar. Medido: el cron\n# corrio a las 04:55, calculo 164 pronosticos, escribio el fichero...\n# y la aplicacion siguio sirviendo el de las 00:24.\n#\n# El bucle anade lo que hay y se salta lo que no, sin tragarse un\n# fallo real en los ficheros que SI estan.\n# v584 — pronostico_dia.json, anunciadas_dia.json y arriesgadas_seguimiento.csv llevan los picks de pago: van cifrados.\npython cajon.py cerrar\nfor _f in cajon historico_partidos.csv team_stats.json historico_itf_vivo.csv historico_nfl_largo.csv lineas_jugador_dia.json lineas_jugador_hist remates_fotmob_jugadores.csv remates_fotmob_equipos.csv remates_fotmob_vacios.txt fotmob_ligas.json bajas_dia.json bajas_historico.csv senal_bajas.csv senal_bajas.json historico_selecciones.csv historico_mex_femenil.csv historico_champions_femenil.csv historico_fem_inglaterra.csv historico_fem_espana.csv historico_fem_alemania.csv historico_fem_francia.csv historico_fem_italia.csv motor_goles.json archivo_contexto.json ponches_snapshots.csv jugados_dia.json jugados_ayer.json capa1_historial.json tiros_dia.json tiros_seguimiento.csv tiros_seguimiento.json analisis_seguimiento.csv alias_equipos.json alias_auto_nombres.json mercado_dia.json nombres_sin_mapear.json resultados_fotmob.csv.gz resultados_flashscore.csv.gz resultados_flashscore_reciente.csv.gz rutas_flashscore.json historia_flashscore.json; do\n  if [ -e \"$_f\" ]; then\n    git add \"$_f\" || echo \"::warning::git add de $_f fallo\"\n  fi\ndone\nif git diff --cached --quiet; then\n  echo \"El precálculo no cambió.\"\nelse\n  # `--rebase` porque los otros workflows commitean a la vez y este\n  # corre ocho veces al día: sin él, la carrera se pierde seguro.\n  git commit -m \"chore(dia): precálculo del día ($(date -u +%Y-%m-%dT%H:%MZ))\"\n  # v312 — el mismo `|| true` que tumbaba al reentrenamiento: ver\n  # `git_sin_conflictos.py`\n  python git_sin_conflictos.py publicar\n  echo \"Día cocinado y publicado.\"\nfi\n"
