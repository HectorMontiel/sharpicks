name: Vigilante de límites

# v542 — mide cada día el uso contra los límites del plan gratis de Supabase (tráfico de salida, base, usuarios activos,
# funciones y correos de alta) y avisa al administrador por Telegram y por correo al 80 % y al 95 %, una vez por nivel.
# Dos horarios por si GitHub se salta uno (los avisos no se repiten). Los lunes, un resumen corto.
on:
  schedule:
    - cron: '17 13 * * *'
    - cron: '47 1 * * *'
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: vigia-limites
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest   # siempre aquí: si el servidor se cae, es quien avisa
    timeout-minutes: 15
    steps:
      # sólo hace falta un archivo: se baja del commit exacto (sin checkout parcial, que envenena runners: test_v519)
      # por la API y con token: la dirección raw da 404 con el repo privado
      - name: Bajar el vigilante
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${{ github.repository }}/contents/vigia_limites.py?ref=${{ github.sha }}" -o vigia_limites.py
      - name: Medir y avisar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE: ${{ secrets.BREVO_REMITENTE }}
          GH_TOKEN: ${{ github.token }}
        run: python3 vigia_limites.py
