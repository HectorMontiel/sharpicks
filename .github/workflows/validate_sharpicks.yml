name: Validar SharPicks sin desplegar

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'exportar_web.py'
      - 'combinadas_web.py'
      - 'test_*.py'
      - 'test_*.cjs'
      - '.github/workflows/**'
  push:
    branches:
      - 'audit/**'
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'exportar_web.py'
      - 'combinadas_web.py'
      - 'test_*.py'
      - 'test_*.cjs'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: validar-sharpicks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Instalar dependencias mínimas de las pruebas
        run: python -m pip install --disable-pip-version-check 'requests>=2.31'
      - name: Validar sintaxis y fechas
        run: |
          set -eu
          node --check web/fechas.js
          node --check web/app.js
          node --check web/cuenta.js
          node test_web_v402.cjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Validar Edge Functions
        run: |
          set -eu
          deno check --no-lock supabase/functions/comentario/index.ts
          deno check --no-lock supabase/functions/vip/index.ts
          deno check --no-lock supabase/functions/stripe/index.ts
          deno check --no-lock supabase/functions/mp-webhook/index.ts
          deno check --no-lock supabase/functions/stripe-webhook/index.ts
      - name: Compilar módulos modificados
        run: |
          python -m py_compile exportar_web.py combinadas_web.py comentarios_correo.py telegram_canales.py
      - name: Pruebas de sincronización y regresión
        run: |
          set -eu
          python -m unittest -v tests.test_sharpicks_contracts
          python -m unittest -v tests.test_python_dependency_graph
          python -m unittest -v tests.test_asset_inventory
          python -m unittest -v tests.test_release_asset_inventory
          python test_exportador_web_v402.py
          python test_v383.py
          python test_v389.py
          python test_v390.py
          python test_v394.py
          python test_v395.py
          python test_v396.py
          python test_v400.py
