name: Bot Telegram - Apuestas del Día

on:
  schedule:
    - cron: '19 10 * * *'   # diario a las 10:00 UTC
  workflow_dispatch:        # ejecución manual desde la web de GitHub
    inputs:
      deportes:
        description: 'Deportes (vacío = todos). Ej.: futbol · nba · futbol,nba'
        type: string
        default: ''

# v508 — el token del workflow, sólo de lectura (no hace commits)
permissions:
  contents: read

env:
  # v510 — repo privado: los modelos del Release se bajan con el token de la corrida
  GH_TOKEN: ${{ github.token }}

jobs:
  enviar_alertas_push:
    if: ${{ github.event_name != 'schedule' || vars.DESPERTADOR != 'activo' }}   # con el despertador sólo envía él
    runs-on: ${{ vars.RUNNER_PESADO || 'ubuntu-latest' }}   # sin la variable, runners de GitHub

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
      # v584 — los picks de pago van cifrados en cajon/ (el repositorio es público)
      - name: Abrir los datos cifrados
        env:
          DATOS_CLAVE: ${{ secrets.DATOS_CLAVE }}
        run: python3 cajon.py abrir

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          python -c "import requests, pandas, numpy; requests.get" || pip install --force-reinstall --no-cache-dir -r requirements.txt   # v516: una instalación cortada a medias se repara sola
      # Servidor propio: Pinnacle y Playdoit se leen de la foto de GitHub (ver foto_precios.py)
      - name: Bajar la foto de precios
        if: ${{ vars.RUNNER_PESADO != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "FOTO_PRECIOS_TTL=14400" >> "$GITHUB_ENV"
          python foto_precios.py --bajar || echo "::warning::sin foto nueva de precios; sigue la anterior si no caducó"

      - name: Ejecutar pipeline quant y alerta de Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          DEPORTES_ENVIO: ${{ inputs.deportes }}
        run: |
          # 1. El runner es un entorno estéril: primero datos frescos del día
          python pipeline_total.py --update-only || echo "pipeline con avisos, se continúa"
          # 2. Calcular los picks y enviar el resumen
          python bot_telegram.py
