name: Prueba del servidor (temporal)

# Sólo para validar los runners propios antes de migrar. No publica ni envía nada.
# Dos a la vez y sin caché, a propósito: es el peor caso para que dos runners se estorben.
# Se borra antes de fusionar la rama.
on:
  push:
    branches: [servidor-propio]
    paths: ['.github/workflows/prueba_servidor.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: [self-hosted, sharpicks-vps]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        copia: [1, 2]
    env:
      GH_TOKEN: ${{ github.token }}
      PRECALCULO_DIA: prueba_pronostico.json
      SERVIDOR_PROCESOS: '3'
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Abrir los datos cifrados
        env:
          DATOS_CLAVE: ${{ secrets.DATOS_CLAVE }}
        run: python3 cajon.py abrir --estricto

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install --quiet -r requirements.txt

      - name: Bajar la foto de precios
        run: |
          echo "FOTO_PRECIOS_TTL=14400" >> "$GITHUB_ENV"
          python foto_precios.py --bajar
          python foto_precios.py --estado

      - name: Cocinar el día
        run: python precalculo_dia.py

      - name: Comprobar
        run: |
          python precalculo_dia.py --estado
          python -c "import cuotas_multi as cm; print('índices', len(cm._indice('futbol')), len(cm._indice_pdt('futbol')))"

      - name: Sacar el sitio, sin claves
        run: python exportar_web.py
